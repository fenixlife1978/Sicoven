name: SICOVEN Windows and Demo Releases
on:
  pull_request:
    branches:
      - 'main'
  push:
    branches:
      - 'main'
      - 'sqlite-desktop-release'
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sicoven-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Restore Windows application icon
        shell: pwsh
        run: |
          $iconPath = Join-Path $env:GITHUB_WORKSPACE 'build/sicoven.ico'
          if (Test-Path 'build/sicoven.ico.base64') {
            $iconBase64 = (Get-Content -Raw 'build/sicoven.ico.base64').Trim()
            if ($iconBase64.Length -gt 100 -and $iconBase64 -ne 'BASE64_PLACEHOLDER') {
              [IO.File]::WriteAllBytes($iconPath, [Convert]::FromBase64String($iconBase64))
            }
          }
          if (-not (Test-Path $iconPath) -or (Get-Item $iconPath).Length -lt 100) {
            throw 'El icono de SICOVEN no se generó correctamente.'
          }
          Copy-Item $iconPath (Join-Path $env:GITHUB_WORKSPACE 'build/icon.ico') -Force
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Test persistent demo action limits
        run: node scripts/test-demo-usage.cjs
      - name: Type-check the application
        run: npm run check:types
      - name: Build full edition (without sample data)
        run: npm run build
      - name: Verify full bundle excludes demo sample records
        shell: pwsh
        run: |
          $bundles = Get-ChildItem -Path dist/assets -Filter '*.js' -File
          if (-not $bundles) { throw 'No se generaron bundles JavaScript para SICOVEN completo.' }
          if (Select-String -Path $bundles.FullName -SimpleMatch -Pattern 'DISTRIBUIDORA LOS ANDES, C.A.' -Quiet) {
            throw 'El bundle completo contiene datos de ejemplo; no se publicará este instalador.'
          }
      - name: Package full Windows installer
        run: npm run dist
      - name: Verify full installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter '*.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'No se generó el instalador completo .exe de SICOVEN.' }
          Get-FileHash $installer.FullName -Algorithm SHA256 | Format-List
      - name: Build demo edition with sample data and limits
        shell: pwsh
        run: |
          $env:VITE_SICOVEN_DEMO = 'true'
          npm run build
          $bundles = Get-ChildItem -Path dist/assets -Filter '*.js' -File
          if (-not $bundles) { throw 'No se generaron bundles JavaScript para SICOVEN DEMO.' }
          if (-not (Select-String -Path $bundles.FullName -SimpleMatch -Pattern 'DISTRIBUIDORA LOS ANDES, C.A.' -Quiet)) {
            throw 'La edición DEMO no contiene los datos de ejemplo esperados.'
          }
          if (-not (Select-String -Path $bundles.FullName -SimpleMatch -Pattern 'Máximo 10 acciones por módulo' -Quiet)) {
            throw 'No se encontró el cintillo de límites comerciales en la edición DEMO.'
          }
      - name: Package separate demo installer
        run: npx electron-builder --win nsis --config electron-builder-demo.json --publish never
      - name: Verify both installers
        shell: pwsh
        run: |
          $full = Get-ChildItem -Path release -Filter '*.exe' -File
          $demo = Get-ChildItem -Path release-demo -Filter '*.exe' -File
          if (-not $full) { throw 'Falta el instalador completo de SICOVEN.' }
          if (-not $demo) { throw 'Falta el instalador DEMO de SICOVEN.' }
          Get-FileHash $full.FullName -Algorithm SHA256 | Format-List
          Get-FileHash $demo.FullName -Algorithm SHA256 | Format-List
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/sqlite-desktop-release' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        shell: pwsh
        run: |
          $files = @((Get-ChildItem -Path release -Filter '*.exe' -File).FullName) + @((Get-ChildItem -Path release-demo -Filter '*.exe' -File).FullName)
          if ($env:REF_NAME -eq 'main' -or $env:REF_NAME -eq 'sqlite-desktop-release') {
            $tag = 'v1.0.0-sqlite-desktop'
            $title = 'SICOVEN 1.0.0 — instaladores de escritorio (Producción)'
            $notes = 'Release oficial de SICOVEN para Windows. Incluye instalador completo con base SQLite y soporte de licencias CRM, e instalador DEMO.'
          } else {
            $tag = $env:REF_NAME
            $title = "SICOVEN $tag"
            $notes = 'Instaladores de SICOVEN completo y DEMO, compilados por GitHub Actions.'
          }
          $releaseExists = $false
          try {
            $null = gh release view $tag 2>&1
            if ($LASTEXITCODE -eq 0) { $releaseExists = $true }
          } catch {
            $releaseExists = $false
          }
          if ($releaseExists) {
            gh release upload $tag $files --clobber
          } else {
            gh release create $tag $files --target $env:GITHUB_SHA --title $title --notes $notes
          }
      - name: Upload complete edition installer
        uses: actions/upload-artifact@v4
        with:
          name: SICOVEN-COMPLETO-Windows-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Upload demo edition installer
        uses: actions/upload-artifact@v4
        with:
          name: SICOVEN-DEMO-Windows-x64
          path: release-demo/*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish artifact checksums
        shell: pwsh
        run: |
          $files = @((Get-ChildItem -Path release -Filter '*.exe' -File)) + @((Get-ChildItem -Path release-demo -Filter '*.exe' -File))
          if (-not $files) { throw 'No hay instaladores para publicar.' }
          'SHA256  Archivo' | Out-File -FilePath checksums-sha256.txt -Encoding utf8
          foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)" | Out-File -FilePath checksums-sha256.txt -Append -Encoding utf8
          }
      - name: Upload installer checksums
        uses: actions/upload-artifact@v4
        with:
          name: SICOVEN-SHA256-checksums
          path: checksums-sha256.txt
          if-no-files-found: error
          retention-days: 30
