name: SICOVEN Windows Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sicoven-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Restore Windows application icon
        shell: pwsh
        run: |
          $iconPath = Join-Path $env:GITHUB_WORKSPACE 'build/sicoven.ico'
          if (Test-Path 'build/sicoven.ico.base64') {
            $iconBase64 = (Get-Content -Raw 'build/sicoven.ico.base64').Trim()
            if ($iconBase64.Length -gt 100 -and $iconBase64 -ne 'BASE64_PLACEHOLDER') {
              [IO.File]::WriteAllBytes($iconPath, [Convert]::FromBase64String($iconBase64))
            }
          }
          if (-not (Test-Path $iconPath) -or (Get-Item $iconPath).Length -lt 100) {
            throw 'El icono de SICOVEN no se generó correctamente.'
          }
          Copy-Item $iconPath (Join-Path $env:GITHUB_WORKSPACE 'build/icon.ico') -Force
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test authentication and session security guards
        run: node scripts/test-auth-hardening.cjs
      - name: Test accounting and credit settlement calculations
        run: npm test
      - name: Type-check the application
        run: npm run check:types
      - name: Audit local resources before production build
        run: npm run audit:assets -- --source-only
      - name: Build full edition (without sample data)
        run: npm run build
      - name: Audit production assets and verify no mock data leaks
        run: npm run audit:assets
      - name: Verify full bundle excludes demo sample records
        shell: pwsh
        run: |
          $bundles = Get-ChildItem -Path dist/assets -Filter '*.js' -File
          if (-not $bundles) { throw 'No se generaron bundles JavaScript para SICOVEN completo.' }
          if (Select-String -Path $bundles.FullName -SimpleMatch -Pattern 'administracion@losandesdist.com.ve' -Quiet) {
            throw 'El bundle completo contiene datos de ejemplo; no se publicará este instalador.'
          }
      - name: Package full Windows installer
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run dist
      - name: Verify full installer
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter '*.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'No se generó el instalador completo .exe de SICOVEN.' }
          Get-FileHash $installer.FullName -Algorithm SHA256 | Format-List
      - name: Install and launch smoke test
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter "SICOVEN-Setup-*-x64.exe" -File | Select-Object -First 1
          if (-not $installer) {
            throw "No se encontró el instalador completo para la prueba de instalación."
          }
          $installDir = Join-Path $env:RUNNER_TEMP "SICOVEN-Release-Smoke"
          if (Test-Path $installDir) {
            Remove-Item -Path $installDir -Recurse -Force
          }
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @("/S", "/D=$installDir") -PassThru
          if (-not $install.WaitForExit(120000)) {
            $autoApplication = Get-Process -Name "SICOVEN" -ErrorAction SilentlyContinue
            if ($autoApplication) {
              & taskkill.exe /IM SICOVEN.exe /T /F | Out-Null
            }
            if (-not $install.WaitForExit(30000)) {
              throw "El instalador NSIS no terminó dentro del tiempo permitido."
            }
          }
          $install.Refresh()
          if ($install.ExitCode -ne 0) {
            throw "El instalador NSIS terminó con código $($install.ExitCode)."
          }
          $app = Join-Path $installDir "SICOVEN.exe"
          $asar = Join-Path $installDir "resources\app.asar"
          $sqliteNative = Join-Path $installDir "resources\app.asar.unpacked\node_modules\better-sqlite3\build\Release\better_sqlite3.node"
          foreach ($required in @($app, $asar, $sqliteNative)) {
            if (-not (Test-Path $required -PathType Leaf)) {
              throw "Falta un archivo esencial después de instalar: $required"
            }
          }
          $autoApplication = Get-Process -Name "SICOVEN" -ErrorAction SilentlyContinue
          if ($autoApplication) {
            & taskkill.exe /IM SICOVEN.exe /T /F | Out-Null
            Start-Sleep -Seconds 2
          }
          $application = Start-Process -FilePath $app -ArgumentList @("--disable-gpu") -PassThru
          Start-Sleep -Seconds 12
          $application.Refresh()
          if ($application.HasExited) {
            throw "SICOVEN se cerró durante el arranque de prueba. Código: $($application.ExitCode)"
          }
          $database = Get-ChildItem -Path $env:APPDATA -Filter "sicoven.sqlite" -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $database) {
            throw "SICOVEN no creó su base de datos SQLite local durante el primer arranque."
          }
          & taskkill.exe /PID $application.Id /T /F | Out-Null
          Write-Host "Instalación, app.asar, módulo SQLite nativo, creación de sicoven.sqlite y arranque verificados."
          Get-Item $installer.FullName | Select-Object Name, Length
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        shell: pwsh
        run: |
          $files = @((Get-ChildItem -Path release -Filter '*.exe' -File).FullName)
          $tag = $env:REF_NAME
          $title = "SICOVEN $tag"
          $notes = 'Instalador completo de SICOVEN para Windows, compilado por GitHub Actions. El período de prueba se gestiona mediante licenciamiento, no con una edición DEMO separada.'
          $releaseExists = $false
          try {
            $null = gh release view $tag 2>&1
            if ($LASTEXITCODE -eq 0) { $releaseExists = $true }
          } catch {
            $releaseExists = $false
          }
          if ($releaseExists) {
            gh release upload $tag $files --clobber
          } else {
            gh release create $tag $files --target $env:GITHUB_SHA --title $title --notes $notes
          }
      - name: Upload complete edition installer
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: SICOVEN-COMPLETO-Windows-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish artifact checksums
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $files = @((Get-ChildItem -Path release -Filter '*.exe' -File))
          if (-not $files) { throw 'No hay instaladores para publicar.' }
          'SHA256  Archivo' | Out-File -FilePath checksums-sha256.txt -Encoding utf8
          foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)" | Out-File -FilePath checksums-sha256.txt -Append -Encoding utf8
          }
      - name: Upload installer checksums
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: SICOVEN-SHA256-checksums
          path: checksums-sha256.txt
          if-no-files-found: error
          retention-days: 30
