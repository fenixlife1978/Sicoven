name: SICOVEN Windows installer

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sicoven-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run automated tests
        run: npm test

      - name: Check TypeScript types
        run: npm run check:types

      - name: Build renderer
        run: npm run build

      - name: Audit production assets
        run: npm run audit:assets

      - name: Build Windows NSIS installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify installer exists
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter "SICOVEN-Setup-*-x64.exe" -File
          if (-not $installer) {
            Write-Error "No se generó el instalador Windows x64 de SICOVEN."
            exit 1
          }
          $installer | Select-Object Name, Length, LastWriteTime | Format-Table

      - name: Install and launch smoke test
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter "SICOVEN-Setup-*-x64.exe" -File | Select-Object -First 1
          if (-not $installer) {
            throw "No se encontró el instalador para la prueba de instalación."
          }
          $installDir = Join-Path $env:RUNNER_TEMP "SICOVEN-Smoke"
          if (Test-Path $installDir) {
            Remove-Item -Path $installDir -Recurse -Force
          }
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @("/S", "/D=$installDir") -PassThru
          if (-not $install.WaitForExit(120000)) {
            $autoApplication = Get-Process -Name "SICOVEN" -ErrorAction SilentlyContinue
            if ($autoApplication) {
              & taskkill.exe /IM SICOVEN.exe /T /F | Out-Null
            }
            if (-not $install.WaitForExit(30000)) {
              throw "El instalador NSIS no terminó dentro del tiempo permitido."
            }
          }
          $install.Refresh()
          if ($install.ExitCode -ne 0) {
            throw "El instalador NSIS terminó con código $($install.ExitCode)."
          }
          $app = Join-Path $installDir "SICOVEN.exe"
          $asar = Join-Path $installDir "resources\app.asar"
          $sqliteNative = Join-Path $installDir "resources\app.asar.unpacked\node_modules\better-sqlite3\build\Release\better_sqlite3.node"
          foreach ($required in @($app, $asar, $sqliteNative)) {
            if (-not (Test-Path $required -PathType Leaf)) {
              throw "Falta un archivo esencial después de instalar: $required"
            }
          }
          $autoApplication = Get-Process -Name "SICOVEN" -ErrorAction SilentlyContinue
          if ($autoApplication) {
            & taskkill.exe /IM SICOVEN.exe /T /F | Out-Null
            Start-Sleep -Seconds 2
          }
          $application = Start-Process -FilePath $app -ArgumentList @("--disable-gpu") -PassThru
          Start-Sleep -Seconds 12
          $application.Refresh()
          if ($application.HasExited) {
            throw "SICOVEN se cerró durante el arranque de prueba. Código: $($application.ExitCode)"
          }
          & taskkill.exe /PID $application.Id /T /F | Out-Null
          Write-Host "Instalación NSIS, app.asar, SQLite nativo y arranque de SICOVEN verificados."
          Get-Item $installer.FullName | Select-Object Name, Length
      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SICOVEN-Windows-${{ github.sha }}
          path: |
            release/SICOVEN-Setup-*-x64.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 30
