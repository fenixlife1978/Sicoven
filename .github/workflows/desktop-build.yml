name: SICOVEN Desktop Validation

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate reproducible dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Propose generated package lockfile
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'build: add reproducible npm lockfile'
          branch: automation/npm-lockfile
          delete-branch: true
          title: 'build: add reproducible npm lockfile'
          body: 'Generado por la validación de escritorio con la resolución de dependencias de npm. La CI instala después con npm ci para comprobar el lockfile.'
          add-paths: package-lock.json
      - name: Test authentication and session security guards
        run: node scripts/test-auth-hardening.cjs
      - name: Run automated tests
        run: npm test
      - name: Check TypeScript
        run: npm run check:types
      - name: Audit source resources
        run: npm run audit:assets -- --source-only
      - name: Build application
        run: npm run build
      - name: Audit production assets
        run: npm run audit:assets
